name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: mx-central-1

jobs:
  verificar:
    name: Verificar (lint, tipos, pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --filter=...[origin/main] necesita el historial

      # La versión de pnpm sale de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # En PR solo lo afectado respecto a main; en push a main (sin base de comparación útil) todo.
      - name: Filtro de turbo
        id: filtro
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--filter=...[origin/main]" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # Incluye eslint de la raíz; es barato, así que se corre completo.
      - run: pnpm lint

      - run: pnpm turbo run typecheck ${{ steps.filtro.outputs.args }}

      # Unitarias + integración (Testcontainers usa el Docker del runner). tests/e2e se excluye: necesita el stack
      # levantado y corre en el job `e2e`.
      - run: pnpm turbo run test ${{ steps.filtro.outputs.args }} --filter='!@consultorio/e2e'

  e2e:
    name: E2E (docker compose)
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generar .env
        run: bash scripts/generar-dev-env.sh

      - name: Levantar el stack
        run: docker compose --profile app up -d --build --wait

      - name: Pruebas E2E
        run: pnpm --filter @consultorio/e2e test

      # Nunca se imprime .env: solo los logs de los contenedores.
      - name: Logs de compose (solo si falla)
        if: failure()
        run: docker compose --profile app logs --no-color --tail=200

      - name: Bajar el stack
        if: always()
        run: docker compose --profile app down -v

  imagenes:
    name: Imagen ${{ matrix.app }}
    # Omitido hasta configurar AWS (variable de repositorio AWS_ROLE_ARN).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Simple a propósito: en main se construyen siempre las tres imágenes (la caché de capas de Docker
        # y `turbo prune` en el Dockerfile mantienen el coste bajo). No se calcula "afectado".
        app: [gateway, svc-identidad, svc-auditoria]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Solo :<sha> (repositorios con etiquetas inmutables). No hay :latest: nada no aprobado puede llegar a una tarea.
      - name: Construir y publicar
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          APP: ${{ matrix.app }}
        run: |
          IMAGEN="${REGISTRO}/consultorio/${APP}:${GITHUB_SHA}"
          docker build -f docker/Dockerfile.service --build-arg APP="${APP}" -t "${IMAGEN}" .
          docker push "${IMAGEN}"

  desplegar:
    name: Desplegar ${{ matrix.app }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.ECS_CLUSTER != ''
    needs: imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: produccion # aprobación manual configurada en el environment
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, svc-identidad, svc-auditoria]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Nueva revisión de la definición de tarea actual del servicio con la imagen :<sha> aprobada, y el servicio pasa a
      # esa revisión. El rollback del circuit breaker vuelve a la revisión anterior (también un :<sha> aprobado).
      - name: Registrar revisión con la imagen del commit y actualizar el servicio
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          APP: ${{ matrix.app }}
          REGISTRO: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGEN="${REGISTRO}/consultorio/${APP}:${GITHUB_SHA}"
          ACTUAL=$(aws ecs describe-services --cluster "${CLUSTER}" --services "${APP}" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "${ACTUAL}" --query taskDefinition > actual.json
          jq --arg app "${APP}" --arg img "${IMAGEN}" '
            if any(.containerDefinitions[]; .name == $app) then . else error("sin contenedor \($app)") end
            | .containerDefinitions |= map(if .name == $app then .image = $img else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
          ' actual.json > nueva.json
          NUEVA=$(aws ecs register-task-definition --cli-input-json file://nueva.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Revisión nueva: ${NUEVA} (antes ${ACTUAL})"
          aws ecs update-service --cluster "${CLUSTER}" --service "${APP}" --task-definition "${NUEVA}" > /dev/null
          aws ecs wait services-stable --cluster "${CLUSTER}" --services "${APP}"
